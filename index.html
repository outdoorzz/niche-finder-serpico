<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niche Finder Pro by Serpico AI Learning Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#0F7BA8;
    --accent-dark:#0B5C80;
    --navy:#091F44;
    --white:#FFFFFF;
    --amber:#E8951A;
    --gray-50:#F7F6F4;
    --gray-100:#EFEDE9;
    --gray-300:#D8D5CF;
    --gray-600:#65605A;
    --gray-800:#2A2723;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--gray-50);
    color:var(--navy);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:780px;margin:0 auto;padding:0 20px 80px;position:relative;}
  header.brand{
    display:flex;align-items:center;gap:14px;
    padding:28px 0 18px;
  }
  header.brand img{height:60px;width:auto;display:block;mix-blend-mode:multiply;}
  .step-rings{display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:14px;}
  .ring{width:9px;height:9px;border-radius:50%;background:var(--gray-300);transition:all .4s ease;}
  .ring.active{background:var(--accent);box-shadow:0 0 0 4px rgba(15,123,174,0.18);}
  .ring.done{background:var(--navy);}

  .tool-name-badge{
    display:flex;align-items:center;gap:5px;
    font-family:'Archivo Black',sans-serif;
    font-size:.95rem;letter-spacing:.01em;
    color:var(--navy);white-space:nowrap;
    border-left:2px solid var(--gray-300);
    padding-left:14px;margin-left:4px;
  }
  .tool-name-badge span{
    background:var(--amber);color:var(--navy);
    font-size:.72rem;padding:2px 7px;border-radius:4px;
    letter-spacing:.06em;text-transform:uppercase;
  }
  .history-btn{
    background:var(--white);border:2px solid var(--navy);border-radius:9px;
    padding:8px 14px;font-weight:700;font-size:.82rem;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:'Inter',sans-serif;
  }
  .history-btn:hover{border-color:var(--accent);color:var(--accent);}
  .history-count{
    background:var(--accent);color:var(--white);border-radius:50%;
    width:18px;height:18px;font-size:.68rem;display:flex;align-items:center;justify-content:center;font-weight:800;
  }

  h1.hero{font-family:'Archivo Black',sans-serif;font-size:2.5rem;line-height:1.05;letter-spacing:-0.01em;margin:6px 0 10px;}
  h1.hero .accent{color:var(--accent);}
  p.lede{font-size:1.05rem;color:var(--gray-600);max-width:560px;margin:0 0 32px;line-height:1.55;}

  .card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;}

  label.field-label{display:block;font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-600);margin-bottom:8px;}
  input[type=text], textarea{
    width:100%;font-size:1.02rem;padding:14px 16px;border:2px solid var(--gray-300);border-radius:10px;
    font-family:'Inter',sans-serif;font-weight:500;background:var(--white);
  }
  textarea{resize:vertical;min-height:70px;font-weight:400;font-size:1rem;}
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--accent);}

  .btn-primary{
    background:var(--navy);color:var(--white);border:none;border-radius:10px;
    padding:15px 26px;font-size:1rem;font-weight:700;font-family:'Inter',sans-serif;
    cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:background .2s ease, transform .1s ease;
  }
  .btn-primary:hover{background:var(--accent);}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary.disabled{background:var(--gray-300);cursor:not-allowed;pointer-events:none;}
  .btn-secondary{
    background:var(--white);color:var(--navy);border:2px solid var(--navy);border-radius:10px;
    padding:13px 24px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
  .btn-ghost{
    background:none;border:none;color:var(--gray-600);font-family:'Inter',sans-serif;font-weight:600;
    font-size:.9rem;cursor:pointer;text-decoration:underline;padding:4px;
  }
  .btn-small-tag{
    background:var(--gray-50);border:1px solid var(--gray-300);border-radius:8px;
    padding:8px 13px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-small-tag:hover{border-color:var(--accent);color:var(--accent);}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

  .droplet-loader{display:flex;flex-direction:column;align-items:center;padding:50px 10px;gap:18px;}
  .droplet-loader svg{width:54px;height:54px;}
  .droplet-loader .msg{font-weight:700;color:var(--gray-800);font-size:1rem;text-align:center;}
  .droplet-loader .sub{color:var(--gray-600);font-size:.88rem;}
  @keyframes pulse-drop{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.12);opacity:.7;}100%{transform:scale(1);opacity:1;}}
  .pulse{animation:pulse-drop 1.4s ease-in-out infinite;}
  @keyframes ripple-grow{0%{r:6;opacity:.9;}100%{r:34;opacity:0;}}
  .ripple{animation:ripple-grow 1.8s ease-out infinite;transform-origin:center;}
  .mini-loader{display:flex;align-items:center;gap:10px;color:var(--gray-600);font-size:.88rem;font-weight:600;padding:10px 0;}
  .mini-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--gray-300);border-top-color:var(--accent);animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}

  .niche-card{
    border:2px solid var(--gray-100);border-radius:var(--radius);padding:22px;margin-bottom:14px;cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;background:var(--white);position:relative;
  }
  .niche-card:hover{border-color:var(--accent);}
  .niche-card.picked{border-color:var(--accent);background:#EFF7FC;}
  .niche-rank{display:inline-block;font-family:'Archivo Black',sans-serif;font-size:.78rem;background:var(--navy);color:var(--white);padding:3px 9px;border-radius:5px;margin-bottom:10px;}
  .niche-rank.top{background:var(--amber);color:var(--navy);}
  .niche-name{font-size:1.22rem;font-weight:800;margin:0 0 6px;}
  .niche-problem{font-size:.96rem;color:var(--gray-800);margin:0 0 12px;line-height:1.5;}
  .why-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px;}
  .why-item{background:var(--gray-50);border-radius:8px;padding:9px 10px;}
  .why-item .k{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-600);}
  .why-item .v{font-size:.86rem;font-weight:600;margin-top:2px;}
  .reasoning{font-size:.88rem;color:var(--gray-600);line-height:1.6;margin-top:12px;}
  @media(max-width:520px){.why-grid{grid-template-columns:1fr;}}

  .format-card{border:2px solid var(--gray-100);border-radius:var(--radius);padding:20px;margin-bottom:14px;cursor:pointer;transition:border-color .15s ease;background:var(--white);}
  .format-card:hover{border-color:var(--accent);}
  .format-card.picked{border-color:var(--accent);background:#EFF7FC;}
  .format-name{font-size:1.1rem;font-weight:800;margin:0 0 4px;}
  .format-meta{display:flex;gap:14px;font-size:.82rem;color:var(--gray-600);margin:6px 0 10px;flex-wrap:wrap;}
  .format-meta span{display:flex;align-items:center;gap:5px;}

  .competitor-panel{background:var(--gray-50);border-radius:var(--radius);padding:18px 20px;margin:6px 0 20px;}
  .competitor-panel .title{font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-600);margin-bottom:12px;}
  .competitor-item{background:var(--white);border:1px solid var(--gray-100);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .competitor-item:last-child{margin-bottom:0;}
  .competitor-item .cname{font-weight:800;font-size:.95rem;margin-bottom:4px;}
  .competitor-item .cprice{display:inline-block;background:var(--accent);color:var(--white);font-weight:800;font-size:.8rem;padding:3px 10px;border-radius:5px;margin-bottom:8px;}
  .competitor-item .cgap{font-size:.86rem;color:var(--gray-600);line-height:1.5;}
  .competitor-item .cgap b{color:var(--gray-800);font-weight:700;}

  .offer-block{background:var(--navy);color:var(--white);border-radius:var(--radius);padding:26px 26px 22px;margin-top:6px;}
  .offer-block .offer-name{font-family:'Archivo Black',sans-serif;font-size:1.5rem;color:var(--white);margin:4px 0 10px;}
  .offer-block .price-tag{display:inline-block;background:var(--amber);color:var(--navy);font-weight:800;padding:6px 14px;border-radius:8px;font-size:1rem;margin-bottom:14px;}
  .offer-block p{line-height:1.65;color:#E8E6E2;font-size:.95rem;margin:0 0 4px;}
  .offer-block .label{color:var(--amber);font-weight:800;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 5px;}

  .locked-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gray-100);border-radius:10px;padding:12px 16px;margin-bottom:22px;font-size:.9rem;flex-wrap:wrap;}
  .locked-summary b{font-weight:800;}
  .locked-summary .actions{display:flex;gap:14px;}

  .footer-note{color:var(--gray-600);font-size:.82rem;text-align:center;margin-top:30px;line-height:1.5;}
  .error-box{background:#FFF1F1;border:1px solid #D93025;color:#B3261E;padding:14px 16px;border-radius:10px;font-size:.9rem;margin-bottom:16px;}

  .verdict-box{border-radius:var(--radius);padding:22px;margin-top:14px;}
  .verdict-box.validated{background:#F0FBF1;border:2px solid #2E9E3F;}
  .verdict-box.notyet{background:#FFF8EE;border:2px solid #D98A1A;}
  .verdict-title{font-family:'Archivo Black',sans-serif;font-size:1.2rem;margin-bottom:8px;}
  .verdict-box.validated .verdict-title{color:#2E9E3F;}
  .verdict-box.notyet .verdict-title{color:#D98A1A;}
  .verdict-section{margin-top:10px;font-size:.9rem;line-height:1.55;}
  .verdict-section b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-600);margin-bottom:3px;}

  .question-chip{background:var(--gray-50);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 14px;margin-bottom:10px;font-size:.92rem;}

  .outreach-card{background:var(--gray-50);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .outreach-card .ch-label{font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:6px;}
  .outreach-card pre{white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:.9rem;margin:0;line-height:1.5;}
  .copy-btn{margin-top:8px;}

  .history-overlay{
    position:fixed;inset:0;background:rgba(10,10,10,0.55);z-index:50;
    display:flex;justify-content:flex-end;
  }
  .history-panel{
    background:var(--white);width:380px;max-width:92vw;height:100%;padding:24px 22px;overflow-y:auto;
    box-shadow:-8px 0 30px rgba(0,0,0,0.2);
  }
  .history-panel h2{font-family:'Archivo Black',sans-serif;font-size:1.3rem;margin:0 0 16px;}
  .history-item{border:2px solid var(--gray-100);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;}
  .history-item:hover{border-color:var(--accent);}
  .history-item .topic{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--gray-600);font-weight:800;}
  .history-item .top-niche{font-weight:700;font-size:.95rem;margin:4px 0 2px;}
  .history-item .date{font-size:.76rem;color:var(--gray-600);}
  .empty-history{color:var(--gray-600);font-size:.9rem;}
  .close-history{float:right;}

  .build-guide{margin-top:22px;}
  .build-tool-banner{
    background:var(--navy);color:var(--white);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:16px;
  }
  .build-tool-banner .tool-name{font-family:'Archivo Black',sans-serif;font-size:1.3rem;margin:4px 0 6px;}
  .build-tool-banner .tool-url{color:var(--amber);font-weight:700;font-size:.9rem;text-decoration:none;}
  .build-tool-banner .tool-url:hover{text-decoration:underline;}
  .build-tool-banner .tool-why{color:#E8E6E2;font-size:.9rem;margin:8px 0 0;line-height:1.5;}
  .build-section-title{font-family:'Archivo Black',sans-serif;font-size:1rem;margin:20px 0 10px;}
  .build-step{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--white);border:1px solid var(--gray-100);border-radius:10px;
    padding:14px 16px;margin-bottom:10px;
  }
  .build-step-num{
    background:var(--accent);color:var(--white);font-family:'Archivo Black',sans-serif;
    font-size:.8rem;min-width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
  }
  .build-step-text{font-size:.92rem;line-height:1.55;color:var(--gray-800);}
  .content-piece{
    background:var(--white);border:2px solid var(--gray-100);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;
  }
  .content-piece-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;cursor:pointer;gap:10px;
  }
  .content-piece-header:hover{background:var(--gray-50);}
  .content-piece-title{font-weight:800;font-size:.95rem;}
  .content-piece-toggle{font-size:1.1rem;color:var(--gray-600);flex-shrink:0;}
  .content-piece-body{
    padding:0 16px 16px;border-top:1px solid var(--gray-100);
    display:none;
  }
  .content-piece-body.open{display:block;}
  .content-piece-body pre{
    white-space:pre-wrap;font-family:'Inter',sans-serif;font-size:.88rem;
    line-height:1.6;margin:12px 0 0;color:var(--gray-800);
  }
  .copy-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--gray-50);border:1px solid var(--gray-300);border-radius:7px;
    padding:6px 12px;font-size:.78rem;font-weight:700;cursor:pointer;margin-top:10px;
    font-family:'Inter',sans-serif;
  }
  .copy-chip:hover{border-color:var(--accent);color:var(--accent);}
  .copy-chip.copied{border-color:#2E9E3F;color:#2E9E3F;}
  .build-tool-banner .tool-url{word-break:break-all;}
  @media(max-width:480px){
    header.brand{gap:10px;}
    header.brand img{height:46px;}
    .tool-name-badge{font-size:.8rem;padding-left:10px;margin-left:0;}
    .tool-name-badge span{font-size:.62rem;padding:2px 5px;}
    .step-rings{display:none;}
    .history-btn{padding:7px 10px;font-size:.76rem;margin-left:auto;}
  }
  @media print{
    header.brand .history-btn, header.brand .step-rings, .footer-note, .history-overlay{display:none !important;}
  }
</style>
</head>

<div class="app" id="app"></div>

const STEP_LABELS = ["Topic","Research","Niche","Format","Offer"];
const STEP_ORDER = ["topic","researching","niche","validate","format","offer"];

function blankSession(){
  return {
    topic: "",
    step: "topic",
    niches: null,
    pickedNicheIdx: null,
    validation: { answers: ["", "", "", "", ""], verdict: null, loading: false },
    formats: null,
    competitors: null,
    competitorsLoading: false,
    pickedFormatIdx: null,
    offer: null,
    outreach: null,
    outreachLoading: false,
    buildGuide: null,
    buildGuideLoading: false,
    createdAt: null,
  };
}

let state = {
  session: blankSession(),
  history: [], // archived sessions
  loading: false,
  loadingStage: "",
  error: null,
  showHistory: false,
};

function ringIndexFor(step){
  if(step==="topic") return 0;
  if(step==="researching") return 1;
  if(step==="niche" || step==="validate") return 2;
  if(step==="format") return 3;
  if(step==="offer") return 4;
  return 0;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${state.showHistory ? renderHistoryOverlay() : ''}
    ${renderBody()}
  `;
  attachHandlers();
}

function renderHeader(){
  const activeIdx = ringIndexFor(state.session.step);
  return `
  <header class="brand">
    <img src="${LOGO_SRC}" alt="Serpico AI Learning Center" />
    <div class="tool-name-badge">Niche Finder <span>Pro</span></div>
    <div class="step-rings">
      ${STEP_LABELS.map((l,i)=>{
        let cls='ring';
        if(i<activeIdx) cls+=' done'; else if(i===activeIdx) cls+=' active';
        return `<div class="${cls}" title="${l}"></div>`;
      }).join('')}
    </div>
    <div class="history-btn" role="button" id="openHistoryBtn">History ${state.history.length?`<span class="history-count">${state.history.length}</span>`:''}</div>
  </header>`;
}

function renderHistoryOverlay(){
  return `
  <div class="history-overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="btn-ghost close-history" id="closeHistoryBtn" role="button">close ✕</div>
      <h2>Past research</h2>
      ${state.history.length===0 ? '<p class="empty-history">Nothing archived yet. Research a topic, then start a new one. It will show up here so you can compare.</p>' : state.history.map((s,i)=>`
        <div class="history-item" data-history-idx="${i}">
          <div class="topic">${escapeHtml(s.topic)}</div>
          <div class="top-niche">${s.niches && s.niches[0] ? escapeHtml(s.niches[0].niche) : ''}</div>

function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

async function callClaude(systemPrompt, userPrompt, useWebSearch, retries=3){
  const body = { model:"claude-sonnet-5", max_tokens:4000, system:systemPrompt, messages:[{role:"user",content:userPrompt}] };
  if(useWebSearch) body.tools = [{ type:"web_search_20250305", name:"web_search" }];
  for(let attempt=0; attempt<retries; attempt++){
    const resp = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)
    });
    if(resp.status === 429){
      if(attempt < retries-1){
        await new Promise(r=>setTimeout(r, (attempt+1)*3000));
        continue;
      }
      throw new Error("The tool is busy right now. Please wait a few seconds and try again.");
    }
    if(!resp.ok) throw new Error("API request failed: "+resp.status);
    const data = await resp.json();
    return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  }
}

function extractJson(text){
  // Strip markdown code fences if present
  let cleaned = text.trim()
    .replace(/^```json\s*/i,'')
    .replace(/^```\s*/,'')
    .replace(/```\s*$/,'');

  // Find the first [ or { that actually starts a JSON structure
  // by scanning forward until we hit one followed by valid JSON content
  function findJsonStart(str, char){
    let idx = str.indexOf(char);
    while(idx !== -1){
      // A real JSON array starts with [{ or [ followed by whitespace then {
      // A real JSON object starts with { followed by " (key)
      const peek = str.slice(idx).trimStart();
      if(char === '[' && /^\[\s*[\[{"]/.test(peek)) return idx;
      if(char === '{' && /^\{\s*"/.test(peek)) return idx;
      idx = str.indexOf(char, idx + 1);
    }
    return -1;
  }

  const arrayStart = findJsonStart(cleaned, '[');
  const objectStart = findJsonStart(cleaned, '{');

  let start;
  if(arrayStart === -1 && objectStart === -1) throw new Error("No JSON found in response");
  else if(arrayStart === -1) start = objectStart;
  else if(objectStart === -1) start = arrayStart;
  else start = Math.min(arrayStart, objectStart);

  const end = Math.max(cleaned.lastIndexOf(']'), cleaned.lastIndexOf('}'));
  if(end === -1) throw new Error("No JSON found in response");

  return JSON.parse(cleaned.substring(start, end + 1));
}

function buildBriefText(){
  const s = state.session;
  let lines = [];
  lines.push("NICHE FINDER PRO. BRIEF");
  lines.push("Topic: " + s.topic);
  lines.push("");
  if(s.pickedNicheIdx!==null && s.niches){
    const n = s.niches[s.pickedNicheIdx];
    lines.push("NICHE: " + n.niche);
    lines.push("PROBLEM: " + n.problem);
    lines.push("Already paying for: " + n.already_paying);
    lines.push("Emotional driver: " + n.emotional_driver);
    lines.push("Evidence: " + n.evidence_source);
    lines.push("Why it works: " + n.reasoning);
    lines.push("");
  }
  if(s.validation && s.validation.verdict){
    const v = s.validation.verdict;
    lines.push("VALIDATION VERDICT: " + v.verdict);
    lines.push("Dollar test: " + v.dollar_test_summary);
    lines.push("Already-paid test: " + v.already_paid_summary);
    lines.push("Reasoning: " + v.reasoning);
    lines.push("Recommendation: " + v.recommendation);
    lines.push("");
  }
  if(s.pickedFormatIdx!==null && s.formats){
    const f = s.formats[s.pickedFormatIdx];
    lines.push("PRODUCT FORMAT: " + f.name);
    lines.push("Build time: " + f.build_time + " | Suggested price: " + f.suggested_price + " | Difficulty: " + f.difficulty);
    lines.push("Why this format: " + f.why_this_works);
    lines.push("");
  }
  if(s.competitors && s.competitors.length){
    lines.push("EXISTING COMPETITORS:");
    s.competitors.forEach(c=>{ lines.push("- " + c.name + " (" + c.price + "). Gap: " + c.what_it_misses); });
    lines.push("");
  }
  if(s.offer){
    lines.push("OFFER: " + s.offer.offer_name + ". " + s.offer.price);
    lines.push("Pitch: " + s.offer.pitch);
    lines.push("Outcome: " + s.offer.outcome);
    lines.push("Payment page copy: " + s.offer.payment_copy);
    lines.push("Validation move: " + s.offer.validation_move);
    if(s.offer.selling_steps && s.offer.selling_steps.length){
      lines.push("");
      lines.push("SELL IT 24/7. SETUP CHECKLIST:");
      s.offer.selling_steps.forEach((step,i)=>{ lines.push((i+1) + ". " + step); });
    }
    lines.push("");
  }
  if(s.buildGuide){
    const g = s.buildGuide;
    lines.push("");
    lines.push("BUILD YOUR PRODUCT");
    lines.push("Tool: " + g.tool_name + " (" + g.tool_url + ")");
    lines.push("Why: " + g.tool_why);
    lines.push("");
    lines.push("STEP 1. CREATE YOUR FREE ACCOUNT");
    g.account_steps.forEach((step,i)=>{ lines.push((i+1) + ". " + step); });
    lines.push("");
    lines.push("STEP 2. " + (g.content_label || "CREATE YOUR CONTENT").toUpperCase());
    g.content_pieces.forEach((piece,i)=>{
      lines.push("");
      lines.push((i+1) + ". " + piece.title);
      lines.push(piece.content);
    });
  }
  if(s.outreach){
    lines.push("OUTREACH: TEXT MESSAGE");
    lines.push(s.outreach.text_message);
    lines.push("");
    lines.push("OUTREACH: DM");
    lines.push(s.outreach.dm_message);
    lines.push("");
    lines.push("OUTREACH: EMAIL (Subject: " + (s.outreach.email_subject||'') + ")");
    lines.push(s.outreach.email);
  }
  return lines.join("\n");
}

function downloadBrief(){
  const text = buildBriefText();
  const blob = new Blob([text], {type:"text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const niche = state.session.niches && state.session.pickedNicheIdx!==null ? state.session.niches[state.session.pickedNicheIdx].niche : state.session.topic;
  const fname = ("NFP-brief-" + niche).toLowerCase().replace(/[^a-z0-9]+/g,'-').substring(0,60) + ".txt";
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

ct-pass{background:#F0FBF1;color:#2E9E3F;border:2px solid #2E9E3F;}.verdict-fail{background:#FFF8EE;color:#D98A1A;border:2px solid #D98A1A;}.competitor{padding:12px 0;border-bottom:1px solid #EFEDE9;}.competitor:last-child{border-bottom:none;}.competitor strong{font-family:'Montserrat',sans-serif;font-size:.95rem;}.price-tag{display:inline-block;background:#0F7BA8;color:#fff;font-family:'Montserrat',sans-serif;font-weight:700;font-size:.78rem;padding:2px 9px;border-radius:5px;margin-left:8px;vertical-align:middle;}.gap{font-size:.88rem;color:#65605A;margin-top:5px;}.price-hero{font-family:'Montserrat',sans-serif;font-size:1.6rem;font-weight:900;color:#0F7BA8;margin-bottom:14px;}.steps-list{padding-left:20px;margin-top:8px;}.steps-list li{font-family:'Montserrat',sans-serif;font-size:.92rem;line-height:1.65;margin-bottom:8px;color:#2A2723;}.content-piece{margin-top:14px;padding:14px;background:#F7F6F4;border-radius:8px;}.piece-title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:.95rem;margin-bottom:8px;color:#091F44;}.piece-body{font-family:'Montserrat',sans-serif;font-size:.9rem;line-height:1.65;color:#2A2723;}.brand-footer{display:flex;align-items:center;gap:16px;margin-top:48px;padding-top:20px;border-top:3px solid #091F44;}.brand-footer img{height:56px;width:auto;mix-blend-mode:multiply;}.footer-tagline{font-family:'Montserrat',sans-serif;font-weight:900;font-size:.95rem;margin-bottom:3px;}.brand-footer a{font-family:'Montserrat',sans-serif;font-size:.88rem;font-weight:700;color:#0F7BA8;}.brand-org{font-family:'Montserrat',sans-serif;font-size:.88rem;font-weight:700;color:#0F7BA8;display:block;}@media print{body{background:#fff;}.page{padding:20px;}.section{box-shadow:none;}}`;
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Niche Finder Pro Brief. Serpico AI Learning Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet"><style>${css}</style></head><body><div class="page">${brandingTop}${sections}${brandingBottom}</div></body></html>`;
}

function printBrief(){
  const html=buildBriefHtml();
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const niche=state.session.niches&&state.session.pickedNicheIdx!==null?state.session.niches[state.session.pickedNicheIdx].niche:state.session.topic;
  const fname=("NFP-brief-"+niche).toLowerCase().replace(/[^a-z0-9]+/g,'-').substring(0,60)+".html";
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
